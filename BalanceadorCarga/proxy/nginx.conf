events {
    worker_connections 1024;
}

http {
    upstream backend_servers {
        server backend1;
        server backend2;
        server backend3;
    }

    server {
        listen 80;

        location / {
            # Envía la solicitud al grupo de servidores backend upstream
            proxy_pass http://backend_servers;

            # Usa HTTP/1.1 para mejor manejo de conexiones con servidores upstream
            proxy_http_version 1.1;

            # Limpia el encabezado Connection para habilitar la reutilización de conexiones
            proxy_set_header Connection "";

            # Reenvía el encabezado Host original al backend
            proxy_set_header Host $host;

            # Pasa la dirección IP real del cliente al backend
            proxy_set_header X-Real-IP $remote_addr;

            # Desactiva el almacenamiento en caché para la solicitud enviada al backend
            proxy_set_header Cache-Control "no-cache, no-store, must-revalidate";

            # Desactiva el almacenamiento en caché en la respuesta enviada al cliente
            add_header Cache-Control "no-cache, no-store, must-revalidate";

            # Añade encabezado mostrando qué servidor upstream manejó la solicitud
            add_header X-Upstream-Server $upstream_addr;
        }
    }
}
